            - schemaVersion
          properties:
            account:
              $ref: "#/components/schemas/NeteaseOwnerAccountV1"
            levelProgress:
              type: object
              additionalProperties: false
              required:
                [currentLoginCount, currentPlayCount, nextLoginCount, nextPlayCount, progress]
              properties:
                currentLoginCount:
                  type: [integer, "null"]
                  minimum: 0
                currentPlayCount:
                  type: [integer, "null"]
                  minimum: 0
                nextLoginCount:
                  type: [integer, "null"]
                  minimum: 0
                nextPlayCount:
                  type: [integer, "null"]
                  minimum: 0
                progress:
                  type: [number, "null"]
                  minimum: 0
            listening:
              type: object
              additionalProperties: false
              required: [totalDurationSeconds, totalListenCount, weeklyDurationMinutes, weeklyTrend]
              properties:
                totalDurationSeconds:
                  type: [number, "null"]
                  minimum: 0
                totalListenCount:
                  type: integer
                  minimum: 0
                weeklyDurationMinutes:
                  type: [number, "null"]
                  minimum: 0
                weeklyTrend:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [label, minutes]
                    properties:
                      label:
                        type: string
                      minutes:
                        type: number
                        minimum: 0
            weeklyRanking:
              type: array
              items:
                $ref: "#/components/schemas/NeteaseRankingItemV1"
            allTimeRanking:
              type: array
              items:
                $ref: "#/components/schemas/NeteaseRankingItemV1"
            recentListening:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [playedAt, track]
                properties:
                  playedAt:
                    type: string
                    format: date-time
                  track:
                    $ref: "#/components/schemas/NeteaseTrackSummaryV2"
            following:
              $ref: "#/components/schemas/NeteaseOwnerPeopleCollectionV1"
            followers:
              $ref: "#/components/schemas/NeteaseOwnerPeopleCollectionV1"
            createdPlaylists:
              $ref: "#/components/schemas/NeteaseOwnerPlaylistCollectionV1"
            medals:
              type: object
              additionalProperties: false
              required: [obtainedCount, items]
              properties:
                obtainedCount:
