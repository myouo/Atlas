                  minimum: 0
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/NeteaseOwnerMedalV1"
            memberships:
              type: array
              items:
                $ref: "#/components/schemas/NeteaseOwnerMembershipV1"
            musicCards:
              type: object
              additionalProperties: false
              required: [sourceAvailability, items]
              properties:
                sourceAvailability:
