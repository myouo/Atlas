openapi: 3.1.0
info:
  title: Nivalis API
  version: 0.6.0
  description: >-
    Frontend-independent contract for profiles and composable Dashboard state.
    Phase 5 adds API-owned Owner authentication, encrypted Provider credential lifecycle,
    the first real read-only Provider module, and Worker-owned QR/SMS credential acquisition
    for NetEase Cloud Music while preserving
    immutable Dashboard revisions and asynchronous Projection isolation. The API returns
    data and semantic capabilities, never UI styling or Provider secrets.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - NivalisSession: []
tags:
  - name: System
    description: Process health and database readiness endpoints.
  - name: Public
    description: Public allowlisted profile and Published Dashboard read models.
  - name: Auth
    description: API-owned GitHub OAuth and opaque Nivalis session lifecycle.
  - name: Dashboard
    description: Owner Draft, Published, and revision lifecycle operations.
  - name: Widget
    description: Widget instance configuration within a Dashboard Draft.
  - name: Provider
    description: Secret-safe Provider connection state and asynchronous synchronization resources.
  - name: Settings
    description: Owner settings expressed as semantic preferences.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API process is alive
      tags: [System]
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /ready:
    get:
      operationId: getReadiness
      summary: Check whether the configured persistence adapter is reachable
      tags: [System]
      security: []
      responses:
        "200":
          description: API is ready to serve persisted data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public/profile:
    get:
      operationId: getPublicProfile
      summary: Read the public profile
      tags: [Public]
      security: []
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/public/dashboards/about:
    get:
      operationId: getPublicAboutDashboard
      summary: Read the published About Me Dashboard snapshot
      tags: [Public]
      security: []
      responses:
        "200":
          description: Published Dashboard read model
          headers:
            ETag:
              $ref: "#/components/headers/ViewETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardReadModel"
        default:
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/auth/github/start:
    post:
      operationId: startGithubOwnerAuthentication
      summary: Create a one-time GitHub OAuth authorization transaction
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Browser navigation target for the GitHub authorization transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStart"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/github/callback:
    get:
      operationId: completeGithubOwnerAuthentication
      summary: Complete GitHub OAuth and issue an opaque Nivalis session
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "302":
          description: Session issued and browser redirected to the configured Web Settings page
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Read the current Nivalis authentication state
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Current session state; never includes OAuth or Provider tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Revoke the current opaque Nivalis session
      tags: [Auth]
      responses:
        "204":
          description: Session revoked and cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/draft:
    get:
      operationId: getAboutDashboardDraft
      summary: Read the owner's current Draft Dashboard state
      tags: [Dashboard]
      description: Returns immutable owner-controlled configuration only; live Provider data is a separate resource.
      responses:
        "200":
          description: Current Draft Dashboard state
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceAboutDashboardDraft
      summary: Save the owner's draft without publishing it
      tags: [Dashboard]
      description: Creates an immutable successor revision and atomically advances the Draft pointer.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardDraftUpdate"
      responses:
        "200":
          description: Newly created current Draft revision
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/data:
    get:
      operationId: getAboutDashboardLiveData
      summary: Read live projections hydrated for the current Draft configuration
      tags: [Dashboard]
      description: Provider-derived data changes independently from the Draft Revision and its rev ETag.
      responses:
        "200":
          description: Current Draft live Widget data
          headers:
            ETag:
              $ref: "#/components/headers/DataETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLiveData"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/publish:
    post:
      operationId: publishAboutDashboard
      summary: Explicitly publish the current Draft state
      tags: [Dashboard]
      description: Copies the current Draft to Published inside one database transaction.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Current Published Dashboard state
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/widgets:
    post:
      operationId: createAboutDashboardWidget
      summary: Add a Widget instance to the About Me Dashboard draft
      tags: [Widget]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWidgetInput"
      responses:
        "201":
          description: Widget configuration created in a new Draft revision
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfiguration"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/widgets/{widgetId}:
    parameters:
      - $ref: "#/components/parameters/WidgetId"
    patch:
      operationId: updateWidget
      summary: Update the semantic configuration of a Widget instance
      tags: [Widget]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateWidgetInput"
      responses:
        "200":
          description: Updated Widget configuration
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfiguration"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWidget
      summary: Remove a Widget instance from the Dashboard draft
      tags: [Widget]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Widget instance removed
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/revisions:
    get:
      operationId: listAboutDashboardRevisions
      summary: List immutable About Dashboard revision metadata
      tags: [Dashboard]
      description: Returns newest-first metadata without loading revision Widget snapshots.
      parameters:
        - $ref: "#/components/parameters/RevisionLimit"
        - $ref: "#/components/parameters/RevisionCursor"
      responses:
        "200":
          description: Cursor-paginated immutable revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardRevisionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getAboutDashboardRevision
      summary: Read one immutable Dashboard revision snapshot
      tags: [Dashboard]
      responses:
        "200":
          description: Immutable Dashboard revision detail
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardRevisionDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/dashboards/about/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
    post:
      operationId: restoreAboutDashboardRevision
      summary: Clone a historical revision into a new current Draft revision
      tags: [Dashboard]
      description: Creates a new Draft revision and never changes the Published pointer.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Newly created restored Draft revision
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers:
    get:
      operationId: listProviderConnections
      summary: List secret-free Owner Provider connection state
      tags: [Provider]
      responses:
        "200":
          description: Provider connection state without credential material
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease:
    get:
      operationId: getNeteaseProviderConnection
      summary: Read secret-free NetEase Cloud Music connection state
      tags: [Provider]
      responses:
        "200":
          description: NetEase connection and credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/data:
    get:
      operationId: getNeteaseProviderDataCatalog
      summary: Read the Owner-only sanitized NetEase data catalog
      description: >-
        Returns the latest normalized Provider data available for composition. It never returns
        MUSIC_U, request headers, private Raw Snapshot fields, or unvalidated Provider payloads.
        Public Dashboard cards are separately projected from explicit dataConfig allowlists.
      tags: [Provider]
      responses:
        "200":
          description: Latest complete sanitized NetEase data catalog
          headers:
            ETag:
              $ref: "#/components/headers/CatalogETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeteaseDataCatalog"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/connect:
    post:
      operationId: connectNeteaseProvider
      summary: Store an encrypted MUSIC_U credential and enqueue validation
      description: The credential is write-only and is never returned by any Nivalis API.
      tags: [Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeteaseConnectInput"
      responses:
        "202":
          description: Encrypted credential stored and validation SyncRun accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/auth-attempts/qr:
    post:
      operationId: startNeteaseQrAuthAttempt
      summary: Create or reuse a NetEase QR login attempt
      description: Provider I/O is queued for the Worker; the API response never contains Cookie material.
      tags: [Provider]
      responses:
        "202":
          description: QR login attempt accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthAttempt"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/auth-attempts/sms:
    post:
      operationId: startNeteaseSmsAuthAttempt
      summary: Create or reuse a NetEase SMS login attempt
      description: Phone input is encrypted as short-lived attempt state and never returned in full.
      tags: [Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeteaseSmsAuthInput"
      responses:
        "202":
          description: SMS delivery attempt accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthAttempt"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/auth-attempts/{attemptId}:
    get:
      operationId: getNeteaseAuthAttempt
      summary: Read one secret-free NetEase login attempt
      tags: [Provider]
      parameters:
        - $ref: "#/components/parameters/AuthAttemptId"
      responses:
        "200":
          description: Current login attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthAttempt"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelNeteaseAuthAttempt
      summary: Cancel one active NetEase login attempt and erase its encrypted state
      tags: [Provider]
      parameters:
        - $ref: "#/components/parameters/AuthAttemptId"
      responses:
        "204":
          description: Attempt cancelled; no credential was changed
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/auth-attempts/{attemptId}/verify:
    post:
      operationId: verifyNeteaseSmsAuthAttempt
      summary: Submit one write-only SMS code for a waiting NetEase attempt
      tags: [Provider]
      parameters:
        - $ref: "#/components/parameters/AuthAttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeteaseSmsVerifyInput"
      responses:
        "202":
          description: SMS verification accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthAttempt"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/netease/connection:
    delete:
      operationId: disconnectNeteaseProvider
      summary: Disable NetEase and delete only its encrypted credential
      description: Raw Snapshots, native observations, and Last Known Good Projections are retained.
      tags: [Provider]
      responses:
        "204":
          description: Connection disabled and credential deleted
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/status:
    get:
      operationId: listProviderStatus
      summary: List configured Provider synchronization states
      tags: [Provider]
      responses:
        "200":
          description: Provider states
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/providers/{provider}/sync:
    post:
      operationId: enqueueProviderSync
      summary: Create or reuse an active Provider SyncRun
      tags: [Provider]
      description: Enqueues asynchronous work and never performs Provider I/O in the API request.
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "202":
          description: SyncRun accepted or an existing active run reused
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sync-jobs/{jobId}:
    get:
      operationId: getSyncJob
      summary: Read one public SyncRun resource
      tags: [Provider]
      description: The jobId is a Nivalis SyncRun UUID and never a pg-boss internal identifier.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current SyncRun state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/settings/appearance:
    get:
      operationId: getAppearanceSettings
      summary: Read the owner's semantic appearance preferences
      tags: [Settings]
      description: Appearance remains browser-local in Phase 5; server persistence is not implemented.
      responses:
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceAppearanceSettings
      summary: Replace the owner's semantic appearance preferences
      tags: [Settings]
      description: Appearance remains browser-local in Phase 5; server persistence is not implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceSettings"
      responses:
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/NotImplemented"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    NivalisSession:
      type: apiKey
      in: cookie
      name: nivalis_session
      description: Opaque Nivalis session token; PostgreSQL stores only its hash.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the current Draft revision on which the mutation is based.
      schema:
        type: string
        pattern: '^"rev:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"$'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RevisionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque newest-first pagination cursor returned by the preceding page.
      schema:
        type: string
        pattern: "^rev:[1-9][0-9]*$"
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Provider"
    WidgetId:
      name: widgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RevisionETag:
      description: Strong validator derived from the immutable Dashboard revision UUID.
      schema:
        type: string
        pattern: '^"rev:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"$'
    ViewETag:
      description: Strong validator for Published Revision plus selected live Projection and effective freshness versions.
      schema:
        type: string
        pattern: '^"view:[0-9a-f]{64}"$'
    DataETag:
      description: Strong validator for the hydrated current-Draft live data representation.
      schema:
        type: string
        pattern: '^"data:[0-9a-f]{64}"$'
    CatalogETag:
      description: Strong validator for the latest immutable Provider data catalog version.
      schema:
        type: string
        pattern: '^"catalog:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"$'
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotImplemented:
      description: Capability is intentionally unavailable in the current phase
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RevisionConflict:
      description: The supplied revision validator is no longer the current Draft.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RevisionConflictProblem"
    PreconditionRequired:
      description: The mutation requires a current Draft If-Match validator.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    AuthStart:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required: [authenticated, actorId, role, expiresAt]
      properties:
        authenticated:
          type: boolean
        actorId:
          type: [string, "null"]
          format: uuid
        role:
          type: [string, "null"]
          enum: [owner, viewer, null]
        expiresAt:
          type: [string, "null"]
          format: date-time
    CredentialStatus:
      type: string
      enum: [not_configured, pending_validation, valid, expired, invalid, revoked]
    ProviderConnection:
      type: object
      additionalProperties: false
      required:
        - provider
        - configured
        - enabled
        - credentialStatus
        - providerAccountId
        - displayName
        - credentialUpdatedAt
        - lastValidatedAt
      properties:
        provider:
          type: string
          const: netease
        configured:
          type: boolean
        enabled:
          type: boolean
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
        providerAccountId:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        credentialUpdatedAt:
          type: [string, "null"]
          format: date-time
        lastValidatedAt:
          type: [string, "null"]
          format: date-time
    NeteaseConnectInput:
      type: object
      additionalProperties: false
      required: [credentialType, credential]
      properties:
        credentialType:
          type: string
          const: music_u
        credential:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
    ProviderConnectAccepted:
      type: object
      additionalProperties: false
      required: [connection, validationJob]
      properties:
        connection:
          $ref: "#/components/schemas/ProviderConnection"
        validationJob:
          $ref: "#/components/schemas/SyncJob"
    ProviderAuthMethod:
      type: string
      enum: [qr, sms_otp]
    ProviderAuthAttemptStatus:
      type: string
      enum:
        - queued
        - preparing
        - waiting_for_scan
        - waiting_for_confirmation
        - waiting_for_code
        - verifying
        - connected
        - expired
        - failed
    ProviderAuthAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - provider
        - method
        - status
        - qrUrl
        - maskedPhone
        - expiresAt
        - resendAfter
        - createdAt
        - updatedAt
        - lastErrorCode
        - lastErrorMessage
      properties:
        attemptId:
          type: string
          format: uuid
        provider:
          type: string
          const: netease
        method:
          $ref: "#/components/schemas/ProviderAuthMethod"
        status:
          $ref: "#/components/schemas/ProviderAuthAttemptStatus"
        qrUrl:
          type: [string, "null"]
          format: uri
        maskedPhone:
          type: [string, "null"]
        expiresAt:
          type: string
          format: date-time
        resendAfter:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastErrorCode:
          type: [string, "null"]
        lastErrorMessage:
          type: [string, "null"]
    NeteaseSmsAuthInput:
      type: object
      additionalProperties: false
      required: [phone, countryCode]
      properties:
        phone:
          type: string
          pattern: "^[0-9]{5,20}$"
          writeOnly: true
        countryCode:
          type: string
          pattern: "^[0-9]{1,4}$"
          writeOnly: true
    NeteaseSmsVerifyInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{4,8}$"
          writeOnly: true
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, requestId]
      properties:
        status:
          const: ok
        requestId:
          type: string
        errors:
          type: array
          items:
            type: string
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, database, requestId]
      properties:
        status:
          const: ready
        database:
          const: reachable
        requestId:
          type: string
    Provider:
      type: string
      enum: [fixture, netease, github, bangumi, steam, bilibili]
    Profile:
      type: object
      additionalProperties: false
      required: [displayName, handle, headline, bio, avatarUrl, tags]
      properties:
        displayName:
          type: string
        handle:
          type: string
        headline:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        tags:
          type: array
          items:
            type: string
    LayoutItem:
      type: object
      additionalProperties: false
      required: [i, x, y, w, h]
      properties:
        i:
          type: string
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        w:
          type: integer
          minimum: 1
        h:
          type: integer
          minimum: 1
    ResponsiveLayout:
      type: object
      additionalProperties: false
      required: [lg, md, sm]
      properties:
        lg:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"
        md:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"
        sm:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"
    WidgetConfiguration:
      type: object
      additionalProperties: false
      required: [id, type, provider, schemaVersion, title, enabled, dataConfig, presentationConfig]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - profile.hero
            - system.stats
            - music.netease.overview
            - music.netease.identity
            - music.netease.listening
            - music.netease.ranking
            - music.netease.social
            - music.netease.playlists
            - music.netease.showcase
            - github.profile
            - bilibili.profile
            - steam.profile
            - bangumi.collection
        provider:
          $ref: "#/components/schemas/Provider"
        schemaVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        enabled:
          type: boolean
        dataConfig:
          type: object
          additionalProperties: true
        presentationConfig:
          type: object
          additionalProperties: true
    WidgetEnvelope:
      type: object
      required:
        [
          id,
          provider,
          schemaVersion,
          title,
          updatedAt,
          stale,
          enabled,
          dataConfig,
          presentationConfig
        ]
      properties:
        id:
          type: string
          format: uuid
        schemaVersion:
          type: integer
          minimum: 1
        provider:
          $ref: "#/components/schemas/Provider"
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        enabled:
          type: boolean
        dataConfig:
          type: object
          additionalProperties: true
        presentationConfig:
          type: object
          additionalProperties: true
    ProfileHeroData:
      $ref: "#/components/schemas/Profile"
    SystemStatData:
      type: object
      additionalProperties: false
      required: [metric, value, unit]
      properties:
        metric:
          type: string
          enum: [uptime_days, providers_connected, sync_completeness, records_collected]
        value:
          type: number
        unit:
          type: string
          enum: [days, providers, percent, records]
    ArtistSummary:
      type: object
      additionalProperties: false
      required: [name, avatarUrl]
      properties:
        name:
          type: string
        avatarUrl:
          type: string
    GenreShare:
      type: object
      additionalProperties: false
      required: [name, share]
      properties:
        name:
          type: string
        share:
          type: number
          minimum: 0
          maximum: 1
    TrendPoint:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: number
          minimum: 0
    NeteaseOverviewData:
      type: object
      additionalProperties: false
      required: [range, plays, minutes, dailyAverage, change, topArtists, genres, trend]
      properties:
        range:
          type: string
          enum: [7d, 30d, year]
        plays:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
        dailyAverage:
          type: integer
          minimum: 0
        change:
          type: number
        topArtists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GenreShare"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
    DataUnavailable:
      type: object
      additionalProperties: false
      required: [availability, reason]
      properties:
        availability:
          type: string
          const: unavailable
        reason:
          type: string
          enum:
            - not_synced
            - provider_omitted
            - unsupported
            - insufficient_coverage
            - schema_unavailable
            - not_public
            - resource_not_found
    NeteaseTrackSummaryV2:
      type: object
      additionalProperties: false
      required: [providerTrackId, name, artists, albumName, coverUrl, durationMs]
      properties:
        providerTrackId:
          type: string
        name:
          type: string
        artists:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [providerArtistId, name]
            properties:
              providerArtistId:
                type: string
              name:
                type: string
        albumName:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
          format: uri
        durationMs:
          type: [integer, "null"]
          minimum: 0
    NeteaseMetricAvailableV2:
      type: object
      additionalProperties: false
      required: [availability, value, unit, provenance]
      properties:
        availability:
          type: string
          const: available
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [plays, minutes]
        provenance:
          type: string
          enum: [provider_reported, nivalis_derived]
    NeteaseAccountAvailableV2:
      type: object
      additionalProperties: false
      required: [availability, providerUserId, displayName]
      properties:
        availability:
          type: string
          const: available
        providerUserId:
          type: string
        displayName:
          type: [string, "null"]
    NeteaseWeeklyAvailableV2:
      type: object
      additionalProperties: false
      required: [availability, period, coverage, provenance, rankedPlayCount, topTracks, topArtists]
      properties:
        availability:
          type: string
          const: available
        period:
          type: string
          const: provider_week
        coverage:
          type: string
          const: top_records
        provenance:
          type: string
          const: nivalis_derived
        rankedPlayCount:
          type: integer
          minimum: 0
        topTracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [track, playCount, score]
            properties:
              track:
                $ref: "#/components/schemas/NeteaseTrackSummaryV2"
              playCount:
                type: integer
                minimum: 0
              score:
                type: number
                minimum: 0
        topArtists:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [providerArtistId, name, rankedPlayCount]
            properties:
              providerArtistId:
                type: string
              name:
                type: string
              rankedPlayCount:
                type: integer
                minimum: 0
    NeteaseRecentAvailableV2:
      type: object
      additionalProperties: false
      required: [availability, coverage, provenance, items]
      properties:
        availability:
          type: string
          const: available
        coverage:
          type: string
          const: provider_recent_limit
        provenance:
          type: string
          const: provider_reported
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [track, playedAt]
            properties:
              track:
                $ref: "#/components/schemas/NeteaseTrackSummaryV2"
              playedAt:
                type: string
                format: date-time
    NeteaseTrendAvailableV2:
      type: object
      additionalProperties: false
      required: [availability, coverage, provenance, points]
      properties:
        availability:
          type: string
          const: available
        coverage:
          type: string
          enum: [provider_week, provider_report]
        provenance:
          type: string
          enum: [provider_reported, nivalis_derived]
        points:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, minutes]
            properties:
              label:
                type: string
              minutes:
                type: number
                minimum: 0
    NeteaseOverviewDataV2:
      type: object
      additionalProperties: false
      required:
        - provider
        - account
        - totalListenCount
        - weeklyListening
        - recentListening
        - listeningDuration
        - trend
      properties:
        provider:
          type: string
          const: netease
        account:
          oneOf:
            - $ref: "#/components/schemas/NeteaseAccountAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
        totalListenCount:
          oneOf:
            - $ref: "#/components/schemas/NeteaseMetricAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
        weeklyListening:
          oneOf:
            - $ref: "#/components/schemas/NeteaseWeeklyAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
        recentListening:
          oneOf:
            - $ref: "#/components/schemas/NeteaseRecentAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
        listeningDuration:
          oneOf:
            - $ref: "#/components/schemas/NeteaseMetricAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
        trend:
          oneOf:
            - $ref: "#/components/schemas/NeteaseTrendAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
    NeteaseUserSummaryV1:
      type: object
      additionalProperties: false
      required: [providerUserId, displayName, avatarUrl, avatarDecorationUrl, signature, vipType]
      properties:
        providerUserId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        avatarDecorationUrl:
          type: [string, "null"]
          format: uri
        signature:
          type: [string, "null"]
        vipType:
          type: [integer, "null"]
          minimum: 0
    NeteasePlaylistSummaryV1:
      type: object
      additionalProperties: false
      required: [providerPlaylistId, name, coverUrl, trackCount, playCount, subscribedCount, tags]
      properties:
        providerPlaylistId:
          type: string
        name:
          type: string
        coverUrl:
          type: [string, "null"]
          format: uri
        trackCount:
          type: integer
          minimum: 0
        playCount:
          type: integer
          minimum: 0
        subscribedCount:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
    NeteaseMedalSummaryV1:
      type: object
      additionalProperties: false
      required: [providerMedalCode, name, description, iconUrl, level, worn]
      properties:
        providerMedalCode:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        iconUrl:
          type: [string, "null"]
          format: uri
        level:
          type: [integer, "null"]
          minimum: 0
        worn:
          type: boolean
    NeteaseMembershipSummaryV1:
      type: object
      additionalProperties: false
      required: [kind, vipCode, level]
      properties:
        kind:
          type: string
          enum: [associator, music_package, red_plus, voice_book, album]
        vipCode:
          type: [integer, "null"]
          minimum: 0
        level:
          type: [integer, "null"]
          minimum: 0
    NeteaseRankingItemV1:
      type: object
      additionalProperties: false
      required: [rank, playCount, score, track]
      properties:
        rank:
          type: integer
          minimum: 1
        playCount:
          type: integer
          minimum: 0
        score:
          type: number
          minimum: 0
        track:
          $ref: "#/components/schemas/NeteaseTrackSummaryV2"
    NeteaseIdentityDataV1:
      type: object
      additionalProperties: false
      required: [provider, publicFields, profile, vip, medals, socialStatus]
      properties:
        provider:
          type: string
          const: netease
        publicFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - display_name
              - avatar
              - avatar_decoration
              - signature
              - level
              - vip
              - following_count
              - follower_count
              - playlist_count
              - event_count
              - medals
              - social_status
              - provider_user_id
        profile:
          type: object
          additionalProperties: false
          required: [availability]
          properties:
            availability:
              type: string
              const: available
            providerUserId:
              type: string
            displayName:
              type: [string, "null"]
            avatarUrl:
              type: [string, "null"]
              format: uri
            avatarDecorationUrl:
              type: [string, "null"]
              format: uri
            signature:
              type: [string, "null"]
            level:
              type: [integer, "null"]
              minimum: 0
            followingCount:
              type: integer
              minimum: 0
            followerCount:
              type: integer
              minimum: 0
            playlistCount:
              type: integer
              minimum: 0
            eventCount:
              type: integer
              minimum: 0
        vip:
          oneOf:
            - type: object
              additionalProperties: false
              required: [availability, active, redVipLevel, redVipAnnualCount, memberships]
              properties:
                availability:
                  type: string
                  const: available
                active:
                  type: boolean
                redVipLevel:
                  type: [integer, "null"]
                  minimum: 0
                redVipAnnualCount:
                  type: [integer, "null"]
                  minimum: 0
                memberships:
                  type: array
                  items:
                    $ref: "#/components/schemas/NeteaseMembershipSummaryV1"
            - $ref: "#/components/schemas/DataUnavailable"
        medals:
          oneOf:
            - type: object
              additionalProperties: false
              required: [availability, obtainedCount, items]
              properties:
                availability:
                  type: string
                  const: available
                obtainedCount:
                  type: integer
                  minimum: 0
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/NeteaseMedalSummaryV1"
            - $ref: "#/components/schemas/DataUnavailable"
        socialStatus:
          oneOf:
            - type: object
              additionalProperties: false
              required: [availability, providerStatusId, name, iconUrl]
              properties:
                availability:
                  type: string
                  const: available
                providerStatusId:
                  type: string
                name:
                  type: string
                iconUrl:
                  type: [string, "null"]
                  format: uri
            - $ref: "#/components/schemas/DataUnavailable"
    NeteaseListeningDataV1:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          publicFields,
          totalListenCount,
          totalListeningDuration,
          weeklyListeningDuration,
          trend
        ]
      properties:
        provider:
          type: string
          const: netease
        publicFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [total_count, total_duration, weekly_duration, trend]
        totalListenCount:
          oneOf:
            - $ref: "#/components/schemas/NeteaseMetricAvailableV3"
            - $ref: "#/components/schemas/DataUnavailable"
        totalListeningDuration:
          oneOf:
            - $ref: "#/components/schemas/NeteaseMetricAvailableV3"
            - $ref: "#/components/schemas/DataUnavailable"
        weeklyListeningDuration:
          oneOf:
            - $ref: "#/components/schemas/NeteaseMetricAvailableV3"
            - $ref: "#/components/schemas/DataUnavailable"
        trend:
          oneOf:
            - $ref: "#/components/schemas/NeteaseTrendAvailableV2"
            - $ref: "#/components/schemas/DataUnavailable"
    NeteaseMetricAvailableV3:
      type: object
      additionalProperties: false
      required: [availability, value, unit, period, provenance]
      properties:
        availability:
          type: string
          const: available
