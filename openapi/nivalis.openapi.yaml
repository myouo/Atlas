      type: object
      additionalProperties: false
      required: [dashboardId, configurationRevisionId, generatedAt, widgets, projectionVersions]
      properties:
        dashboardId:
          type: string
          const: about
        configurationRevisionId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/WidgetProjection"
        projectionVersions:
          type: array
          items:
            $ref: "#/components/schemas/WidgetProjectionVersion"
    ProviderStatus:
      type: object
      additionalProperties: false
      required:
        - provider
        - connection
        - credentialStatus
        - syncStatus
        - attemptCount
        - lastAttemptAt
        - lastSuccessAt
        - lastErrorCode
        - lastErrorMessage
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        connection:
          type: string
          enum: [connected, fixture, not_connected, requires_attention, disabled]
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
        syncStatus:
          type: string
          enum: [idle, queued, running, retrying, completed, failed, credential_invalid]
        attemptCount:
          type: integer
          minimum: 0
        lastAttemptAt:
          type: [string, "null"]
          format: date-time
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastErrorCode:
          type: [string, "null"]
        lastErrorMessage:
          type: [string, "null"]
    SyncJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - provider
        - status
        - attemptCount
        - requestedAt
        - startedAt
        - finishedAt
        - lastErrorCode
        - lastErrorMessage
      properties:
        jobId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Provider"
        status:
          type: string
          enum: [queued, running, retrying, completed, failed]
        attemptCount:
          type: integer
          minimum: 0
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        lastErrorCode:
          type: [string, "null"]
        lastErrorMessage:
          type: [string, "null"]
    AppearanceSettings:
      type: object
      additionalProperties: false
      required: [theme, font, glassIntensity, accent, backgroundMode]
      properties:
        theme:
          type: string
          enum: [light, system]
        font:
          type: string
          enum: [noto-sans, system]
        glassIntensity:
          type: string
          enum: [subtle, balanced, strong]
        accent:
          type: string
          enum: [blue, lilac, rose]
        backgroundMode:
          type: string
          enum: [fixed, rotate]
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
    RevisionConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [currentRevisionId, currentRevisionNumber, currentEtag]
          properties:
            currentRevisionId:
              type: string
              format: uuid
            currentRevisionNumber:
              type: integer
              minimum: 1
            currentEtag:
              type: string
              pattern: '^"rev:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"$'
