name: Refresh profile SVG

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all variants even when published content is unchanged
        type: boolean
        default: false
  schedule:
    # Provider sync runs at 00/06/12/18 UTC. Retry hourly through transient failures.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: refresh-profile-svg
  cancel-in-progress: false

jobs:
  render:
    if: ${{ vars.SVG_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/setup@v2
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build native DOM converter
        run: pnpm build:svg:capture
      - name: Publish public SVG variants
        env:
          SVG_PUBLISH_TOKEN: ${{ secrets.SVG_PUBLISH_TOKEN }}
          SVG_FORCE_CAPTURE: ${{ inputs.force == true && '1' || '' }}
        run: pnpm svg:publish

  record-health:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record successful monthly refresh
        # Public schedules stop after 60 days without repository activity.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const month = new Date().toISOString().slice(0, 7);
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/.github/svg-publisher-health.json`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const response = await fetch(endpoint, { headers });
          if (!response.ok && response.status !== 404)
            throw new Error(`Health record HTTP ${response.status}`);
          const existing = response.ok ? await response.json() : null;
          const health = existing ? JSON.parse(Buffer.from(existing.content, 'base64').toString()) : null;
          if (health?.lastSuccessfulMonth === month) {
            console.log('Monthly refresh health is already recorded.');
          } else {
            const content = JSON.stringify({ lastSuccessfulMonth: month, workflow: 'refresh-profile-svg' }, null, 2) + '\n';
            const saved = await fetch(endpoint, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `chore: record successful SVG refresh for ${month}`,
                content: Buffer.from(content).toString('base64'),
                ...(existing ? { sha: existing.sha } : {})
              })
            });
            if (!saved.ok) throw new Error(`Health record update HTTP ${saved.status}`);
            console.log('Monthly refresh health recorded.');
          }
          JS
