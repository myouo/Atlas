name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nivalis_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nivalis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/setup@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source, OpenAPI, secrets, and architecture boundaries
        run: pnpm lint

      - name: Generate API client
        run: pnpm generate

      - name: Verify generated client is committed
        run: git diff --exit-code -- packages/api-client/src/generated

      - name: Type check
        run: pnpm typecheck

      - name: Run unit, component, and OpenAPI structure tests
        run: pnpm test

      - name: Verify migrations and idempotent Seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
          FIXTURE_PROVIDER_ENABLED: "true"
          NODE_ENV: test
        run: |
          pnpm db:migrate
          pnpm db:migrate:status
          pnpm db:seed
          pnpm db:seed

      - name: Run migration, concurrency, repository, API contract, and Worker integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
          FIXTURE_PROVIDER_ENABLED: "true"
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
        run: pnpm test:integration

      - name: Build all applications and packages
        run: pnpm build

      - name: Verify Cloudflare generated types
        run: pnpm cf:typecheck && pnpm cf:typecheck:pages

      - name: Build Cloudflare Pages static preview
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_DASHBOARD_SOURCE: api
        run: pnpm build:pages

      - name: Dry-run Cloudflare Edge Worker bundle
        run: pnpm build:edge

      - name: Verify D1 Seed is deterministic
        run: |
          pnpm generate:d1-seed
          git diff --exit-code -- infra/providers/cloudflare/edge/seed.sql

      - name: Smoke test local D1 API Worker
        run: pnpm test:smoke:d1

      - name: Smoke test compiled API runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
        run: pnpm test:smoke:api

      - name: Smoke test compiled Worker runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
          FIXTURE_PROVIDER_ENABLED: "true"
          NODE_ENV: test
        run: pnpm test:smoke:worker

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run critical-path E2E tests
        run: pnpm test:e2e

      - name: Run API-mode persistence, conflict, and sync E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
          FIXTURE_PROVIDER_ENABLED: "true"
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nivalis_test
        run: pnpm test:e2e:api
